<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日本旅行隨手記 & 時間表</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f8fafc; color: #0f172a; padding-bottom: 70px; }
    
    header { background: #2563eb; color: white; padding: 12px; text-align: center; }
    header h1 { font-size: 1.1rem; }

    /* 頁面分頁 */
    .page { display: none; padding: 14px; }
    .page.active { display: block; }

    /* Tab 1: 快捷按鈕 */
    .quick-btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
    .q-btn { background: #e0e7ff; color: #3730a3; border: 1px solid #c7d2fe; padding: 12px 6px; border-radius: 8px; font-weight: bold; font-size: 0.85rem; cursor: pointer; }
    .q-btn:active { background: #c7d2fe; }

    /* 表單區塊 */
    .form-group { background: #fff; padding: 16px; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); margin-bottom: 12px; }
    .form-group label { font-size: 0.8rem; color: #64748b; font-weight: bold; display: block; margin-bottom: 4px; }
    .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; margin-bottom: 12px; font-size: 0.95rem; }
    
    .btn-submit { width: 100%; padding: 12px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; }
    .btn-submit:active { background: #1d4ed8; }

    /* Tab 3: Timetable */
    .timetable-container { overflow-x: auto; background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    table.tt-table { width: 100%; border-collapse: collapse; min-width: 480px; text-align: center; font-size: 0.8rem; }
    table.tt-table th, table.tt-table td { border: 1px solid #cbd5e1; padding: 6px 4px; vertical-align: top; }
    table.tt-table th { background: #f1f5f9; color: #334155; }
    .weather-header { font-size: 0.75rem; color: #64748b; font-weight: normal; margin-top: 2px; }
    
    .cell-event { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; border-radius: 4px; padding: 6px; font-size: 0.75rem; text-align: left; margin-bottom: 4px; }
    .cell-address { font-size: 0.65rem; color: #475569; margin-top: 3px; border-top: 1px dashed #cbd5e1; padding-top: 2px; }
    .cell-gps { font-size: 0.65rem; color: #0284c7; text-decoration: none; display: inline-block; margin-top: 2px; font-weight: bold; }

    /* 底部 Tab 導覽列 */
    .tab-bar {
      position: fixed; bottom: 0; left: 0; width: 100%; height: 55px; background: #fff;
      display: flex; border-top: 1px solid #e2e8f0; z-index: 100;
    }
    .tab-btn { flex: 1; border: none; background: none; font-size: 0.85rem; color: #64748b; font-weight: bold; cursor: pointer; }
    .tab-btn.active { color: #2563eb; border-top: 3px solid #2563eb; }
  </style>
</head>
<body>

  <header>
    <h1>🇯🇵 日本行程助手 & 記帳</h1>
  </header>

  <!-- PAGE 1: ⚡ 快速打卡 -->
  <div id="page-track" class="page active">
    <div class="quick-btns">
      <button class="q-btn" onclick="quickFill('上車')">🚍 上車</button>
      <button class="q-btn" onclick="quickFill('落車')">🚌 落車</button>
      <button class="q-btn" onclick="quickFill('入座/食飯')">🍽️ 食飯</button>
    </div>

    <div class="form-group">
      <label>行程 / 地點描述</label>
      <input type="text" id="eventDetail" placeholder="例如：JR 山手線 / 一蘭拉麵">
      
      <label>對應時間格</label>
      <input type="time" id="eventTime">
      
      <label>對應日期</label>
      <input type="date" id="eventDate">

      <button class="btn-submit" id="btnSaveEvent" onclick="saveEvent()">📍 標記並記錄 GPS 與地址</button>
    </div>
  </div>

  <!-- PAGE 2: 💸 快速記帳 -->
  <div id="page-expense" class="page">
    <div class="form-group">
      <label>金額 (¥ / HKD)</label>
      <input type="number" id="expAmount" placeholder="0" inputmode="numeric">

      <label>付款方式</label>
      <select id="expMethod">
        <option value="CREDIT">💳 Credit Card</option>
        <option value="IC">🐧 IC 卡 (Suica/Pasmo)</option>
        <option value="CASH">💵 Cash 現金</option>
      </select>

      <label>店名 / 備註 (可留空)</label>
      <input type="text" id="expShop" placeholder="例如：FamilyMart / 買藥妝">

      <button class="btn-submit" id="btnSaveExpense" style="background: #059669;" onclick="saveExpense()">💵 記錄開支與地址</button>
    </div>
  </div>

  <!-- PAGE 3: 📅 矩陣時間表 -->
  <div id="page-timetable" class="page">
    <div class="timetable-container">
      <table class="tt-table">
        <thead>
          <tr>
            <th style="width: 50px;">Time</th>
            <th>20/9 (日)<div class="weather-header">🌤️ 13-4°</div></th>
            <th>21/9 (一)<div class="weather-header">☀️ 16-5°</div></th>
            <th>22/9 (二)<div class="weather-header">☀️ 17-5°</div></th>
          </tr>
        </thead>
        <tbody id="timetable-body">
          <!-- 由 JS 自動渲染 07:00 ~ 23:00 時間列 -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- 底部 Tab Bar -->
  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('page-track', this)">⚡ 打卡</button>
    <button class="tab-btn" onclick="switchTab('page-expense', this)">💸 記帳</button>
    <button class="tab-btn" onclick="switchTab('page-timetable', this)">📅 時間表</button>
  </div>

  <!-- Firebase SDK (Modular v10) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // ⚠️ 請替換為你自己的 Firebase Project 設定
    const firebaseConfig = {
      apiKey: "AIzaSyCa4lyhpiBcTdPAp_6DN0_elzYwZnCzirE",
      authDomain: "travelremarks-b4f76.firebaseapp.com",
      projectId: "travelremarks-b4f76",
      storageBucket: "travelremarks-b4f76.firebasestorage.app",
      messagingSenderId: "333967646842",
      appId: "1:333967646842:web:4e5c4d278a211640899bc3"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 預設填入當前日期與時間
    const now = new Date();
    document.getElementById('eventDate').value = now.toISOString().split('T')[0];
    document.getElementById('eventTime').value = now.toTimeString().substring(0, 5);

    // 1. GPS Helper Function
    function getGPSLocation() {
      return new Promise((resolve) => {
        if (!navigator.geolocation) return resolve(null);
        navigator.geolocation.getCurrentPosition(
          (pos) => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
          () => resolve(null),
          { enableHighAccuracy: true, timeout: 5000 }
        );
      });
    }

    // 2. 逆地理編碼：GPS -> 大約地址 (OpenStreetMap 免費 API)
    async function getReadableAddress(lat, lng) {
      try {
        const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=16&addressdetails=1&accept-language=ja,zh-TW`;
        const res = await fetch(url);
        const data = await res.json();
        
        if (data && data.address) {
          const addr = data.address;
          // 組合日本地址結構：例如 "東京都 新宿区" 或 "大阪府 中央区"
          const state = addr.province || addr.state || '';
          const city = addr.city || addr.town || addr.suburb || addr.city_district || '';
          const road = addr.road || addr.neighbourhood || '';
          return `${state} ${city} ${road}`.trim() || data.display_name;
        }
        return "未知大約地址";
      } catch (e) {
        console.warn("地址讀取失敗:", e);
        return null;
      }
    }

    // Tab 切換
    window.switchTab = function(pageId, btn) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(pageId).classList.add('active');
      btn.classList.add('active');

      if (pageId === 'page-timetable') renderTimetable();
    }

    // 快捷輸入按鈕
    window.quickFill = function(prefix) {
      const timeStr = new Date().toTimeString().substring(0, 5);
      document.getElementById('eventTime').value = timeStr;
      document.getElementById('eventDetail').value = `${prefix}: `;
      document.getElementById('eventDetail').focus();
    }

    // 儲存打卡 (含 GPS + 大約地址)
    window.saveEvent = async function() {
      const detail = document.getElementById('eventDetail').value;
      const time = document.getElementById('eventTime').value;
      const date = document.getElementById('eventDate').value;
      const btn = document.getElementById('btnSaveEvent');

      if (!detail) return alert('請輸入行程內容');

      btn.innerText = "⏳ 定位與解析地址中...";
      btn.disabled = true;

      const location = await getGPSLocation();
      let address = null;
      if (location) {
        address = await getReadableAddress(location.lat, location.lng);
      }

      try {
        await addDoc(collection(db, "log_events"), {
          detail,
          eventTime: time,
          eventDate: date,
          updatedTimestamp: new Date().toISOString(),
          location: location,
          address: address // 寫入大約地址文字
        });
        alert('打卡成功！' + (address ? `\n📍 位置: ${address}` : ''));
        document.getElementById('eventDetail').value = '';
      } catch (e) {
        alert('儲存失敗: ' + e.message);
      } finally {
        btn.innerText = "📍 標記並記錄 GPS 與地址";
        btn.disabled = false;
      }
    }

    // 儲存開支
    window.saveExpense = async function() {
      const amount = document.getElementById('expAmount').value;
      const method = document.getElementById('expMethod').value;
      const shop = document.getElementById('expShop').value;
      const btn = document.getElementById('btnSaveExpense');

      if (!amount) return alert('請輸入金額');

      btn.innerText = "⏳ 定位中...";
      btn.disabled = true;

      const location = await getGPSLocation();
      let address = null;
      if (location) {
        address = await getReadableAddress(location.lat, location.lng);
      }

      try {
        await addDoc(collection(db, "expenses"), {
          amount: Number(amount),
          paymentMethod: method,
          shopName: shop || '',
          timestamp: new Date().toISOString(),
          location: location,
          address: address
        });
        alert('記帳成功！');
        document.getElementById('expAmount').value = '';
        document.getElementById('expShop').value = '';
      } catch (e) {
        alert('儲存失敗: ' + e.message);
      } finally {
        btn.innerText = "💵 記錄開支與地址";
        btn.disabled = false;
      }
    }

    // 渲染 Timetable
    async function renderTimetable() {
      const tbody = document.getElementById('timetable-body');
      tbody.innerHTML = '<tr><td colspan="4">資料載入中...</td></tr>';

      try {
        const querySnapshot = await getDocs(collection(db, "log_events"));
        const events = [];
        querySnapshot.forEach(doc => events.push(doc.data()));

        let html = '';
        for (let hour = 7; hour <= 23; hour++) {
          const hourStr = String(hour).padStart(2, '0');
          const timeLabel = `${hourStr}:00`;

          const d1 = events.filter(e => e.eventDate.endsWith('09-20') && e.eventTime.startsWith(hourStr));
          const d2 = events.filter(e => e.eventDate.endsWith('09-21') && e.eventTime.startsWith(hourStr));
          const d3 = events.filter(e => e.eventDate.endsWith('09-22') && e.eventTime.startsWith(hourStr));

          html += `
            <tr>
              <td><strong>${timeLabel}</strong></td>
              <td>${renderCell(d1)}</td>
              <td>${renderCell(d2)}</td>
              <td>${renderCell(d3)}</td>
            </tr>
          `;
        }
        tbody.innerHTML = html;
      } catch (e) {
        tbody.innerHTML = `<tr><td colspan="4">載入失敗: ${e.message}</td></tr>`;
      }
    }

    function renderCell(eventList) {
      if (!eventList || eventList.length === 0) return '';
      return eventList.map(e => `
        <div class="cell-event">
          <strong>${e.eventTime}</strong> ${e.detail}
          ${e.address ? `<div class="cell-address">📍 ${e.address}</div>` : ''}
          ${e.location ? `<a class="cell-gps" href="https://www.google.com/maps?q=${e.location.lat},${e.location.lng}" target="_blank">開啟 Google Maps ➔</a>` : ''}
        </div>
      `).join('');
    }
  </script>
</body>
</html>
